
name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Pacman animation
        uses: Platane/snk@v3
        with:
          github_user_name: aasimdott
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&color_snake=yellow

      - name: Push Pacman animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: aasimdott

      - name: Commit files
        run: |
          git config user.name aasimdott
          git config user.email aasimdott@gmail.com
          git add .
          git commit -m "Update contribution graph" || exit 0
          git push